# Проверки каждого pull request: тесты инструментов, целостность аддона (хэши, таблицы, Lua, декодирование
# новых и изменённых OGG), неизменность плеера, отсутствие личных данных и ключей, новая версия при изменении аддона.
name: Проверки

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Lua и ffmpeg — не через apt: зеркала Ubuntu отдают пакеты медленно
      - name: Lua 5.1
        uses: leafo/gh-actions-lua@v12
        with:
          luaVersion: "5.1.5"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Статический ffmpeg из пакета imageio-ffmpeg (PyPI, версия закреплена) — тот же, что у конвертера
      - name: ffmpeg
        run: |
          python -m pip install --quiet "imageio-ffmpeg==0.6.0"
          mkdir -p "$RUNNER_TEMP/bin"
          ln -s "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$RUNNER_TEMP/bin/ffmpeg"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Проверка ffmpeg
        run: ffmpeg -hide_banner -version | head -1
      - name: Тесты инструментов
        run: python3 -m unittest discover tools
      - name: Проверка аддона
        run: |
          BASE="origin/${{ github.base_ref || 'main' }}"
          python3 tools/check.py --strict --decode-changed "$BASE" --require-new-version "$BASE"
      - name: Поиск ключей и токенов (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
